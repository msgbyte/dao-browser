name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-android-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        if: github.event_name == 'pull_request'
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Build release APK
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done
          umask 077
          trap 'rm -f dao-release.jks' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > dao-release.jks
          ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: dao-android-${{ github.event_name == 'pull_request' && 'debug' || 'release' }}-${{ github.sha }}
          path: android/app/build/outputs/apk/${{ github.event_name == 'pull_request' && 'debug' || 'release' }}/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

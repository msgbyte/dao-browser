name: Deploy Website to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - 'docs/changelog/**'
      - '.github/workflows/deploy-website.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'docs/changelog/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

concurrency:
  group: deploy-website-${{ github.ref }}
  # Finish the production deployment before another main deployment starts.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CLOUDFLARE_PAGES_PROJECT: dao-website
  WRANGLER_VERSION: 4.165.0

jobs:
  check:
    name: Check website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate signed Windows feed and installers
        run: |
          npm ci --prefix ..
          npm --prefix .. run release:check-windows-update

      - name: Type-check website
        run: npm run check

      - name: Lint website
        run: npm run lint

      - name: Build website
        run: npm run build

  deploy:
    name: Deploy (${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && 'production' || 'preview' }})
    needs: check
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Set deployment branch
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_FULL: ${{ github.ref }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_REF_FULL" = "refs/heads/main" ] && { [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; }; then
            branch="main"
          else
            branch="${HEAD_REF:-$REF_NAME}"
            branch="${branch:-preview}"
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: pages deploy website/out --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT }} --branch=${{ steps.target.outputs.branch }} --commit-dirty=true

      - name: Write deployment summary
        if: steps.deploy.outputs.deployment-url != ''
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          printf 'Deployed to: %s\n' "$DEPLOY_URL" >> "$GITHUB_STEP_SUMMARY"

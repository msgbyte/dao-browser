<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dao 更新窗口预览</title>
<style>
  :root {
    color-scheme: light;
    --desktop: #e9eef5; --window: #fcfdfe; --ink: #15171a; --muted: #515b65;
    --edge: #c9d1db; --accent: #3478ce; --action: #3064a5; --glow: #dcecff;
    font: 14px/1.5 "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
    color: var(--ink); background: var(--desktop);
  }
  :root[data-dark] { color-scheme: dark; --desktop: #262c32; --window: #363b40; --ink: #fafcff; --muted: #c8d1db;
    --edge: #515b66; --accent: #80b5ff; --action: #356bac; --glow: #394e69; }
  :root[data-dark] .logo { filter: invert(1); }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; }
  main { min-height: 100svh; display: grid; place-content: center; justify-items: center;
    gap: 36px; padding: 24px 12px; }
  button, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .stage { display: grid; place-items: center; min-height: 268px; width: min(368px, calc(100vw - 24px)); }
  .window { width: 100%; min-height: 268px; position: relative; isolation: isolate;
    background: var(--window); border: 1px solid var(--edge); border-radius: 8px;
    box-shadow: 0 9px 24px -9px #344a685c, 0 1px 4px #344a6814;
    padding: 45px 18px 30px; text-align: center; }
  .minimize { position: absolute; right: 0; top: 0; width: 44px; height: 30px;
    border: 0; border-radius: 0 8px 0 0; background: transparent; display: grid; place-items: center; }
  .minimize svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.5; }
  .minimize:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); }
  .window[data-error] #minimize { right: 42px; }
  .emblem { position: relative; width: 114px; height: 114px; margin: 0 auto 18px;
    display: grid; place-items: center; }
  .emblem::before { content: ""; position: absolute; inset: 6%; border-radius: 50%;
    background: var(--glow); filter: blur(13px); }
  .ring { position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 65deg, transparent 0deg 19deg, #9bc2ff14 52deg,
      #69a3ffb3 119deg, #b3d1ff26 210deg, #8cbbff57 290deg, #287efa 360deg);
    mask: radial-gradient(closest-side, transparent calc(100% - 2px), #000 calc(100% - 1.3px), #000 calc(100% - .6px), transparent);
    animation: spin 2.1s linear infinite; }
  @keyframes spin { to { transform: rotate(1turn); } }
  .logo { position: relative; width: 78px; height: 78px; object-fit: contain; }
  h1 { margin: 0; font-size: 20px; font-weight: 650; line-height: 1.35; }
  .message { margin: 6px auto 0; font-size: 13px; line-height: 1.55; color: var(--muted); text-wrap: pretty; }
  .actions { display: flex; justify-content: center; gap: 8px; margin-top: 17px; }
  .control { border: 1px solid var(--edge); border-radius: 6px; padding: 5px 12px; background: var(--window); }
  .control:hover { border-color: var(--accent); }
  .primary { background: var(--action); color: white; border-color: var(--action); }
  .window[data-error] { padding-top: 30px; padding-bottom: 20px; }
  .window[data-error] .emblem { width: 80px; height: 80px; }
  .window[data-error] .logo { width: 51px; height: 51px; }
  .window[data-error] .ring { display: none; }
  .window[data-error] .emblem::before { opacity: .35; }
  .outside { text-align: center; }
  .outside p { margin: 0 0 14px; color: var(--muted); }
  .tools { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px;
    font-size: 12px; color: var(--muted); }
  .theme { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
  select { max-width: 100%; cursor: pointer; }
  dialog { max-width: min(340px, calc(100vw - 40px)); border: 1px solid var(--edge); border-radius: 8px;
    padding: 20px; background: var(--window); color: var(--ink); }
  dialog::backdrop { background: #18233254; }
  dialog h2 { margin: 0; font-size: 17px; }
  dialog p { color: var(--muted); }
  dialog code { display: block; font-size: 12px; overflow-wrap: anywhere; }
  dialog button { margin-top: 16px; }
  @media (prefers-reduced-motion: reduce) { .ring { animation: none; } }
  @media (forced-colors: active) {
    .ring { background: none; mask: none; border: 2px solid Highlight; border-inline-end-color: transparent; }
    .emblem::before { display: none; }
    .logo { background: white; filter: none; forced-color-adjust: none; border-radius: 50%; }
  }
</style>

        launchError: ["Reopening failed", "Dao could not open", "The update is installed. Try opening the browser again."],

      }
    },
    "zh-CN": {
      title: "Dao 更新窗口预览", select: "预览状态", play: "演示更新", pause: "暂停演示", dark: "深色",
      minimize: "最小化", restore: "还原窗口", replay: "重新演示",
      hidden: "更新窗口已最小化。", dismissed: "更新窗口已关闭。", finished: "Dao 已打开，更新窗口已关闭。",
      installRetry: "重试安装", launchRetry: "打开 Dao", details: "查看日志详情",
      logs: "更新日志", logsNote: "实际安装时，可以在以下位置查看安装日志和更新交接日志。", close: "关闭",
      states: {
        prepare: ["准备更新", "正在准备 Dao 更新", "浏览器关闭后将开始安装。"],
        install: ["安装中", "正在安装 Dao 更新", "更新完成后，浏览器会自动打开。"],
        launch: ["重新打开", "正在重新打开 Dao", "更新已安装完成。"],
        installError: ["安装失败", "Dao 更新未完成", "可以重试安装，也可以先查看日志详情。"],
        launchError: ["启动失败", "Dao 未能自动打开", "更新已安装完成，可以重新打开浏览器。"],
        done: ["浏览器已打开"]
      }
    }
  };
  const language = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "zh-CN";
  const copy = locales[language];
  const byId = (id) => document.getElementById(id);
  const frame = byId("window");
  const selector = byId("state");
  // Demo timing only. The native design advances on installer and browser events.
  const sequence = ["prepare", "install", "launch", "done"];
  const delays = { prepare: 1800, install: 4200, launch: 2000 };
  let state = "install";
  let timer;
  let minimized = false;
  let dismissed = false;
  let playing = false;

  function render() {
    const finished = state === "done";
    const error = state === "installError" || state === "launchError";
    const [, title, description] = copy.states[state];
    frame.hidden = finished || minimized || dismissed;
    byId("outside").hidden = !frame.hidden;
    byId("outside-label").textContent = finished ? copy.finished : dismissed ? copy.dismissed : copy.hidden;
    byId("restore").textContent = finished || dismissed ? copy.replay : copy.restore;
    byId("dismiss").hidden = !error;
    frame.toggleAttribute("data-error", error);
    byId("headline").textContent = title || "";
    byId("description").textContent = description || "";
    byId("actions").hidden = !error;
    byId("retry").textContent = state === "launchError" ? copy.launchRetry : copy.installRetry;
    byId("play").textContent = playing ? copy.pause : copy.play;
    selector.value = state;
  }

  function show(next, auto = false, keepMinimized = false) {
    clearTimeout(timer);
    state = next;
    dismissed = false;
    minimized = keepMinimized && minimized;
    playing = auto && next !== "done";
    render();
    if (playing) {
      timer = setTimeout(() => show(sequence[sequence.indexOf(state) + 1], true, true), delays[state]);
    }
  }

  document.documentElement.lang = language;
  document.title = copy.title;
  byId("state-label").textContent = copy.select;
  byId("dark-label").textContent = copy.dark;
  byId("dark").onchange = () => document.documentElement.toggleAttribute("data-dark", byId("dark").checked);
  byId("minimize").ariaLabel = copy.minimize;
  byId("dismiss").ariaLabel = copy.close;
  byId("details").textContent = copy.details;
  byId("logs-title").textContent = copy.logs;
  byId("logs-note").textContent = copy.logsNote;
  byId("close").textContent = copy.close;
  for (const [value, [label]] of Object.entries(copy.states)) selector.add(new Option(label, value));
  selector.onchange = () => show(selector.value);
  byId("play").onclick = () => playing ? show(state, false, true) : show("prepare", true);
  byId("retry").onclick = () => {
    show(state === "launchError" ? "launch" : "install", true);
    byId("minimize").focus();
  };
  byId("details").onclick = () => byId("logs").showModal();
  byId("minimize").onclick = () => {
    minimized = true; render(); byId("restore").focus();
  };
  byId("dismiss").onclick = () => {
    dismissed = true; render(); byId("restore").focus();
  };
  byId("restore").onclick = () => {
    if (state === "done" || dismissed) show("prepare", true);
    else { minimized = false; render(); }
    byId("minimize").focus();
  };
  render();
  byId("tools").hidden = false;
</script>
</html>
